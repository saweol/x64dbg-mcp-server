[project]
name = "x64dbg-vm-gateway"
version = "0.1.0"
description = "Host-side MCP gateway that drives x64dbg-MCP inside VMware guests: snapshots, file transfer, debugger supervision."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    # imported directly by the package (also pulled in by mcp; declared so a change in
    # mcp's own requirements cannot remove them)
    "anyio>=4.5",
    "jsonschema>=4.20",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
aeszip = ["pyzipper>=0.3.6"]

[project.scripts]
x64dbg-vm-gateway = "x64dbg_vm_gateway.frontends.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x64dbg_vm_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not vm'"
timeout = 60
markers = [
    "vm: requires the real VMware spike VM (run with -m vm)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The tested modules are pure logic; running them on Linux as well
        # keeps them free of accidental Win32 dependencies, while the
        # Windows run exercises the real SRWLOCK code path.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Run tests
        run: zig build test --summary all

  build:
    name: Build Plugins
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Build x32 and x64 plugins
        run: zig build -Doptimize=ReleaseSafe
